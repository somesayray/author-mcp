[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "author-mcp"
version = "0.1.0"
description = "Author MCP Root Server & Air Traffic Control (ATC) for Author Project"
authors = [{ name = "Ray Bayly" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
]

[project.scripts]
author-mcp = "author_mcp.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["author_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
